plc_bridge:
  ros__parameters:

    # ------------------------------------------------------------------
    # OPC UA connection
    # Run scripts/browse_plc.py to discover node IDs.
    # The certificate is auto-generated by browse_plc.py on first run.
    # ------------------------------------------------------------------
    opcua_endpoint: "opc.tcp://172.16.0.151:4840"
    opcua_username: "admin"
    opcua_password: "botbotbot"
    opcua_cert_file: "~/.config/agrobot_plc_bridge/certs/client_cert.der"
    opcua_key_file:  "~/.config/agrobot_plc_bridge/certs/client_key.pem"

    # ------------------------------------------------------------------
    # Output node IDs  (Phoenix Contact AXC F 2152, ns=6, ExposeIO1)
    # Values are integers: 0=OFF  1=SOLID  2=BLINK  3=FAST_BLINK
    # ------------------------------------------------------------------
    output_nodes:
      running_tower: "ns=6;s=Arp.Plc.Eclr/ExposeIO1.RunningTowerLight_Mode"
      fault_tower:   "ns=6;s=Arp.Plc.Eclr/ExposeIO1.FaultTowerLight_Mode"
      auto:          "ns=6;s=Arp.Plc.Eclr/ExposeIO1.AutoPanelLight_Mode"
      cycle:         "ns=6;s=Arp.Plc.Eclr/ExposeIO1.CyclePanelLight_Mode"
      step:          "ns=6;s=Arp.Plc.Eclr/ExposeIO1.StepPanelLight_Mode"
      prev:          "ns=6;s=Arp.Plc.Eclr/ExposeIO1.PrevPanelLight_Mode"
      halt:          "ns=6;s=Arp.Plc.Eclr/ExposeIO1.HaltPanelLight_Mode"
      slow:          "ns=6;s=Arp.Plc.Eclr/ExposeIO1.SlowPanelLight_Mode"
      buzzer:        "ns=6;s=Arp.Plc.Eclr/ExposeIO1.Buzzer_Mode"

    # ------------------------------------------------------------------
    # Button node IDs  (Phoenix Contact AXC F 2152, ns=6, ExposeIO1)
    # Values are booleans: False=released  True=pressed
    # ------------------------------------------------------------------
    button_nodes:
      slow:  "ns=6;s=Arp.Plc.Eclr/ExposeIO1.SlowButton"
      emote: "ns=6;s=Arp.Plc.Eclr/ExposeIO1.EmoteButton"
      halt:  "ns=6;s=Arp.Plc.Eclr/ExposeIO1.HaltButton"
      auto:  "ns=6;s=Arp.Plc.Eclr/ExposeIO1.AutoButton"
      cycle: "ns=6;s=Arp.Plc.Eclr/ExposeIO1.CycleButton"
      step:  "ns=6;s=Arp.Plc.Eclr/ExposeIO1.StepButton"
      prev:  "ns=6;s=Arp.Plc.Eclr/ExposeIO1.PrevButton"

    # ------------------------------------------------------------------
    # Global timing
    # ------------------------------------------------------------------
    trigger_rearm_timeout: 5.0    # seconds — re-arm a trigger button if no ACK arrives
    state_change_debounce: 0.05   # seconds — dead time between state-change calls

    # ------------------------------------------------------------------
    # Per-button configuration
    # mode: trigger | state_change | disabled
    # service: fully-qualified ROS2 service name to call on button event
    # ------------------------------------------------------------------
    buttons:
      slow:
        mode: state_change
        service: /agrobot/plc/slow
      emote:
        mode: trigger
        service: /agrobot/plc/emote
      halt:
        mode: trigger
        service: /agrobot/plc/halt
      auto:
        mode: trigger
        service: /agrobot/plc/auto
      cycle:
        mode: trigger
        service: /agrobot/plc/cycle
      step:
        mode: trigger
        service: /agrobot/plc/step
      prev:
        mode: trigger
        service: /agrobot/plc/prev
